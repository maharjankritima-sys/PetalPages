{% extends "base.html" %}

{% block body_class %}create-page{% endblock %}

{% block title %}
New Journal
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-5">

                <h2 class="fw-bold text-center mb-4">
                    ✍️ Write a New Journal
                </h2>


                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}


                    <!-- Media Upload -->

                    <div class="mb-4">

                        <label for="media" class="form-label fw-semibold">
                            📸 Add Photos & Videos
                        </label>

                        <input
                            type="file"
                            name="media"
                            id="media"
                            class="form-control"
                            multiple
                            accept="image/*,video/*"
                        >

                        <div class="form-text">
                            You can select multiple photos or videos.
                        </div>

                    </div>


                    <!-- Save -->

                    <button
                        type="submit"
                        class="btn btn-dark w-100">

                        Save Journal

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
