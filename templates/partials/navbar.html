<nav class="navbar navbar-expand-lg">

    <div class="container">

        <!-- Brand -->

        <a class="navbar-brand fw-bold" href="/">
            🌸 Petal Pages
        </a>


        <!-- Navigation -->

        <div class="d-flex align-items-center flex-wrap gap-2">

            {% if user.is_authenticated %}

                <span class="fw-semibold me-2">
                    👋 Hi, {{ user.username }}
                </span>


                <a href="{% url 'journal_dashboard' %}"
                   class="btn btn-dark">

                    📖 My Journal

                </a>


                <a href="{% url 'trash' %}"
                   class="btn btn-outline-dark">

                    🗑️ Trash

                </a>


                <a href="{% url 'profile' %}"
                   class="btn btn-outline-dark">

                    👤 Profile

                </a>


                <form method="POST"
                      action="{% url 'logout' %}"
                      class="d-inline">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-outline-dark">

                        Logout

                    </button>

                </form>


            {% else %}

                <a href="{% url 'login' %}"
                   class="btn btn-outline-dark">

                    Login

                </a>


                <a href="{% url 'register' %}"
                   class="btn btn-dark">

                    Register

                </a>

            {% endif %}

        </div>

    </div>

</nav>
